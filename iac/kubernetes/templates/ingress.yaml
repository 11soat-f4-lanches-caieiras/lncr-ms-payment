{{- /* Ingress minimalista usando apenas o primeiro host definido */ -}}
{{- if and .Values.ingress.enabled (gt (len .Values.ingress.hosts) 0) -}}
{{- $hostEntry := index .Values.ingress.hosts 0 -}}
{{- if and $hostEntry.host (not (hasPrefix "${" $hostEntry.host)) (ne $hostEntry.host "") -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Values.app.name }}-ingress
  labels:
    app: {{ .Values.app.name }}
spec:
  ingressClassName: {{ .Values.ingress.className | default "alb" }}
  rules:
  - host: {{ $hostEntry.host | quote }}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: {{ .Values.app.name }}-service
            port:
              number: {{ .Values.service.port }}
{{- end -}}
{{- end -}}

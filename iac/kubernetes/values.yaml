#valores padrões para o Helm Chart

#ServiceAccount
serviceAccount:
  name: secrets-sa

#Aplicação
app:
  name: payment
  replicas: 1
  image:
    repository: ${AWS_ECR_REPOSITORY}
    tag: latest
    pullPolicy: IfNotPresent
  port: 8080
  containerName: payment
  internalUrl: ${LNCR_INTERNAL_URL}
  externalUrl: ${LNCR_EXTERNAL_URL}
  mercadoPago:
    oauthUrl: ${MERCADOPAGO_OAUTH_URL}
    ordersUrl: ${MERCADOPAGO_ORDERS_URL}
    expirationTime: ${MERCADOPAGO_EXPIRATION_TIME}

#Service
service:
  port: 80
  targetPort: 8080

#Ingress
ingress:
  enabled: true
  className: alb
  annotations:
    alb.ingress.kubernetes.io/scheme: internal
    alb.ingress.kubernetes.io/backend-protocol: HTTP
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
    alb.ingress.kubernetes.io/healthcheck-path: /actuator/health
    alb.ingress.kubernetes.io/load-balancer-name: "lncr-prd-int-alb"
    alb.ingress.kubernetes.io/group.name: "lncr-prd-internal"
    # As anotações abaixo serão definidas via --set-string na pipeline:
    # - alb.ingress.kubernetes.io/subnets
    # - alb.ingress.kubernetes.io/security-groups
  hosts:
  - paths:
    - path: /payments
      pathType: Prefix
  tls: []


#Deployment
resources:
  pods:
    requests:
      memory: "384Mi"
      cpu: "300m"
    limits:
      memory: "768Mi"
      cpu: "600m"

#HPA
hpa:
  enabled: true
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

#SecretProviderClass
secretProviderClass:
  name: "lncr-ms-payment-prd-secrets"
  namespace: production
  provider: aws
  parameters:
    region: "us-east-1"
    objects:
      - objectName: ${ AWS_SECRET_MANAGER_ARN }
        objectType: secretsmanager
  keys:
    - POSTGRES_URL
    - POSTGRES_USER
    - POSTGRES_PASSWORD
    - MERCADOPAGO_CLIENT_ID
    - MERCADOPAGO_SECRET_ID
    - MERCADOPAGO_POS_ID
    - MERCADOPAGO_WEBHOOK_SECRET
  secretObjects:
    - secretName: payment-secret
      type: Opaque
  twoSecrets:
    enabled: false
deploySecretName: payment-secret
